<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PMO管理</title>
  <link rel="stylesheet" href="./css/pmo-admin.css" />
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>PMO管理</h1>
      <div class="description">
        希望休一覧の確認とCSV出力を行います。
      </div>

      <div id="entryBannerArea"></div>

      <label>ログインユーザー</label>
      <div class="info-box" id="userNameBox">取得中...</div>

      <div class="mt-12">
        <label>社員コード</label>
        <div class="info-box" id="employeeCodeBox">取得中...</div>
      </div>

      <div class="mt-12">
        <label>アカウント情報</label>
        <div id="accountMetaArea"></div>
      </div>
    </div>

    <div class="card">
      <h2>対象月</h2>

      <label for="monthSelect">希望休一覧の月を選択</label>
      <select id="monthSelect" class="select-box"></select>

      <div class="hint" id="monthHint">存在する月のみ選択できます。</div>
    </div>

    <div class="card">
      <h2>操作</h2>

      <div class="button-stack">
        <button class="open-btn" id="openMonthlyBtn" type="button">希望休一覧を開く</button>
        <button class="open-btn" id="openRequestBtn" type="button">申請原本を開く</button>
        <button class="csv-btn" id="downloadCsvBtn" type="button">CSV出力</button>
      </div>

      <div class="hint" id="manageHint">管理対象ロールのみ利用できます。</div>
    </div>

    <div class="card">
      <button class="csv-btn" id="downloadCsvBtn" type="button">Excel出力</button>
      <div class="message" id="messageBox"></div>
    </div>
  </div>

  <script type="module" src="./js/pmo-admin/main.js"></script>
</body>
</html>
