<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登録申請管理</title>
  <link rel="stylesheet" href="./css/signup-admin.css" />
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>登録申請管理</h1>
      <div class="description">
        利用申請の確認、承認、却下を行います。
      </div>

      <div id="entryBannerArea"></div>

      <label>ログインユーザー</label>
      <div class="info-box" id="userNameBox">取得中...</div>

      <div class="mt-12">
        <label>社員コード</label>
        <div class="info-box" id="employeeCodeBox">取得中...</div>
      </div>

      <div class="mt-12">
        <label>アカウント情報</label>
        <div id="accountMetaArea"></div>
      </div>
    </div>

    <div class="card">
      <h2>申請一覧</h2>
      <div class="hint">申請日時、氏名、メールアドレスのみ一覧表示します。</div>
      <div id="requestListArea" class="list-area"></div>
    </div>

    <div class="card">
      <h2>申請詳細</h2>

      <div class="detail-grid">
        <div class="detail-row">
          <div class="detail-label">申請日時</div>
          <div class="detail-value" id="detailSubmittedAt">未選択</div>
        </div>

        <div class="detail-row">
          <div class="detail-label">氏名</div>
          <div class="detail-value" id="detailApplicantName">未選択</div>
        </div>

        <div class="detail-row">
          <div class="detail-label">メールアドレス</div>
          <div class="detail-value" id="detailApplicantEmail">未選択</div>
        </div>

        <div class="detail-row">
          <div class="detail-label">申請区分</div>
          <div class="detail-value" id="detailApplicantType">未選択</div>
        </div>

        <div class="detail-row">
          <div class="detail-label">会社名 / 所属名</div>
          <div class="detail-value" id="detailCompanyName">未選択</div>
        </div>

        <div class="detail-row">
          <div class="detail-label">業務連絡可能な電話番号</div>
          <div class="detail-value" id="detailPhone">未選択</div>
        </div>

        <div class="detail-row">
          <div class="detail-label">備考</div>
          <div class="detail-value" id="detailNote">未選択</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>承認設定</h2>

      <label for="roleSelect">role</label>
      <select id="roleSelect" class="select-box">
        <option value="">選択してください</option>
        <option value="employee">employee</option>
        <option value="partner_individual">partner_individual</option>
        <option value="partner_company_admin">partner_company_admin</option>
      </select>

      <label for="organizationIdInput" class="mt-12">organization_id</label>
      <input type="text" id="organizationIdInput" class="text-box" placeholder="例: ORG-001" />

      <label for="allowedModulesInput" class="mt-12">allowed_modules</label>
      <input type="text" id="allowedModulesInput" class="text-box" placeholder="例: partner_hub" />

      <label for="statusSelect" class="mt-12">status</label>
      <select id="statusSelect" class="select-box">
        <option value="active">active</option>
        <option value="inactive">inactive</option>
      </select>

      <label for="workStatusSelect" class="mt-12">work_status</label>
      <select id="workStatusSelect" class="select-box">
        <option value="on">on</option>
        <option value="off">off</option>
      </select>

      <label for="employeeCodeInput" class="mt-12">employee_code（任意）</label>
      <input type="text" id="employeeCodeInput" class="text-box" placeholder="必要な場合のみ入力" />
    </div>

    <div class="card">
      <div class="button-stack">
        <button class="approve-btn" id="approveBtn" type="button">承認する</button>
        <button class="reject-btn" id="rejectBtn" type="button">却下する</button>
        <button class="back-btn" id="backToAccountPortalBtn" type="button">アカウント基盤へ戻る</button>
      </div>

      <div class="message" id="messageBox"></div>
    </div>
  </div>

  <script type="module" src="./js/signup-admin/main.js"></script>
</body>
</html>
